global:
  env:
  - name: AUTHENTIK_SECRET_KEY
    valueFrom:
      secretKeyRef:
        name: authentik-key
        key: secretkey

authentik:
  postgresql:
    host: file:///postgres-creds/host
    port: 5432
    name: file:///postgres-creds/dbname
    user: file:///postgres-creds/username
    password: file:///postgres-creds/password
  error_reporting:
    enabled: true
server:
  resources:
    requests:
      cpu: 100m
      memory: 768Mi
    limits:
      cpu: 750m
      memory: 1200Mi
  ingress:
    enabled: false
  route:
    main:
      enabled: true
      annotations:
        gethomepage.dev/description: Authentication
        gethomepage.dev/enabled: "true"
        gethomepage.dev/group: System
        gethomepage.dev/icon: authentik.png
        gethomepage.dev/name: authentik
        gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik
        gethomepage.dev/weight: "30"
        gethomepage.dev/widget.type: authentik
        gethomepage.dev/widget.version: "2"
        gethomepage.dev/widget.url: http://authentik-server.authentik.svc:80
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_KEY}}"
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway
        namespace: istio-ingress
        sectionName: https
      hostnames:
      - authentik.home.com
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-pgsql-app
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
worker:
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 640Mi
  volumes:
    - name: postgres-creds
      secret:
        secretName: authentik-pgsql-app
  volumeMounts:
    - name: postgres-creds
      mountPath: /postgres-creds
      readOnly: true
