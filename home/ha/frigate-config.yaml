mqtt:
  host: mqtt
  port: 1883
  user: mqtt
  password: '{FRIGATE_MQTT_PASSWORD}'
tls:
  enabled: false
face_recognition:
  enabled: true
  model_size: small
auth:
  enabled: false
proxy:
  default_role: viewer
  separator: '|' # This value defaults to a comma, but Authentik uses a pipe, for example.
  header_map:
    user: X-authentik-username
    role: x-authentik-groups
logger:
  default: info
  # logs:
  #   frigate.app: debug
  #   frigate.mqtt: debug
  #   frigate.object_detection: debug
  #   detector.ov: debug
  #   watchdog.hikvision-1: debug
  #   ffmpeg.hikvision-1.detect: debug
detectors:
  coral:
    type: edgetpu
    device: pci
model:
  model_type: yolo-generic
  width: 320
  height: 320
  path: /config/yolov9-s-relu6-best_320_int8_edgetpu.tflite
  labelmap_path: /config/labels-coco17.txt
detect:
  enabled: true
  width: 1280
  height: 720
  fps: 5
objects:
  track:
    - person
    - car
    - motorcycle
    - bicycle
record:
  enabled: true
  alerts:
    retain:
      days: 10
  detections:
    retain:
      days: 7
  continuous:
    days: 1
  motion:
    days: 4
ffmpeg:
  hwaccel_args: preset-vaapi
  output_args:
    record: preset-record-generic-audio-aac
go2rtc:
  ffmpeg:
    global: -vaapi_device /dev/dri/renderD128
  streams:
    hikvision-1:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-2:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-3:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-4:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-5:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-6:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-7:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-8:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-9:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-10:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-11:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    hikvision-11_talk:
      - rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
    pollo-1:
      - rtsp://admin:{FRIGATE_POLLO_PASSWORD}@y.y.y.y
      - ffmpeg:pollo-1#audio=aac
    pollo-2:
      - rtsp://admin:{FRIGATE_POLLO_PASSWORD}@y.y.y.y
      - ffmpeg:pollo-2#audio=aac
  webrtc:
    candidates:
      - y.y.y.y
      - stun:18555
cameras:
  # Define at least one camera
  hikvision-1:
    record:
      motion:
        days: 2
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/hikvision-1
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
          roles:
            - detect
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          enabled: true
          coordinates: 0.183,0,0.291,0,0.291,0.049,0.185,0.044
  hikvision-2:
    record:
      motion:
        days: 2
    ffmpeg:
      inputs:
        - path: rtsp://127.0.0.1:8554/hikvision-2
          roles:
            - record
        - path: 
            rtsp://admin:{FRIGATE_HIKVISION_PASSWORD}@y.y.y.y
          roles:
            - detect
    motion:
      mask:
        timestamp:
          friendly_name: Timestamp
          enabled: true
          coordinates: 1,0.316,0.523,0.084,0.182,0.13,0,0.172,0,0,1,0
    objects:
      track:
        - person
      filters:
        person:
          mask:
            over_the_wall:
              friendly_name: Over the wall
              enabled: true
              coordinates: 1,0.316,0.523,0.084,0.182,0.13,0,0.172,0,0,1,0
