classification:
  custom:
    Gate:
      enabled: true
      name: Gate
      threshold: 0.8
      state_config:
        cameras:
          hikvision-5:
            crop:
              - 0.5586847680309462
              - 0.050428489149967795
              - 0.8550108439948586
              - 0.577230401974701
        motion: true
    BMW:
      enabled: true
      name: BMW
      threshold: 0.8
      state_config:
        cameras:
          hikvision-7:
            crop:
              - 0.0007184964676967097
              - 0.25686220257622416
