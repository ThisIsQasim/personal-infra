---
# Serves this cluster's OIDC discovery doc + JWKS under kubernetes.home.com
# so AWS IAM can register it as an OIDC identity provider for IRSA-style
# pod-to-AWS-role federation. The apiserver's own --service-account-issuer
# is set to https://kubernetes.home.com (no port) to match.
#
# Both paths proxy straight to the real apiserver. Routed via a manually-
# addressed Service (no selector, explicit Endpoints at the kube-vip HA VIP
# for the control plane, y.y.y.y
# cert's own SAN list and the gateway's kube-vip.io/loadbalancerIPs pattern
# in gateway.yaml) rather than through the built-in `kubernetes` Service:
# Istio silently ignores any DestinationRule TLS override targeting
# kubernetes.default.svc.cluster.local (confirmed live - correct policy,
# confirmed pushed by istiod, but Envoy's cluster still used the default
# auto-mTLS matcher, not the policy) - and an ExternalName alias to it
# doesn't dodge this either, since Istio registers the cluster under the
# resolved target name, not the alias's own name.
#
# TODO: the apiserver's own /.well-known/openid-configuration already
# reports the correct "issuer", but its "jwks_uri" is the raw internal node
# IP, not this public hostname - deliberately not fixed via kube-apiserver's
# --service-account-jwks-uri flag, since that would make in-cluster JWKS
# consumers depend on this external hostname/gateway path being up. Needs a
# response-body rewrite in front of this proxy instead (Lua EnvoyFilter, or
# a small dedicated proxy) to patch just that field - not yet added, so
# /.well-known/openid-configuration currently proxies through with the
# wrong jwks_uri until that's in place.
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-apiserver
spec:
  ports:
  - port: 443
    targetPort: 6443
    protocol: TCP
    name: https
---
apiVersion: v1
kind: Endpoints
metadata:
  name: kubernetes-apiserver
subsets:
- addresses:
  - ip: y.y.y.y
  ports:
  - port: 6443
    name: https
    protocol: TCP
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: kubernetes-apiserver
spec:
  host: kubernetes-apiserver.utilities.svc.cluster.local
  trafficPolicy:
    tls:
      mode: SIMPLE
      # apiserver cert is signed by this cluster's own self-signed CA, which
      # Istio doesn't trust by default; skipped rather than wiring up the CA
      # bundle since this hop is intra-cluster only - the public side is
      # verified for real via cluster-wildcard-cert.
      insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kubernetes-oidc-discovery
  labels:
    app: kubernetes-oidc-discovery
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
    namespace: istio-ingress
    sectionName: https
  hostnames:
  - kubernetes.home.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    backendRefs:
    - name: kubernetes-apiserver
      port: 443
  - matches:
    - path:
        type: Exact
        value: /openid/v1/jwks
    backendRefs:
    - name: kubernetes-apiserver
      port: 443
