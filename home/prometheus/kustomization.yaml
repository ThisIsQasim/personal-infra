apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

commonAnnotations:
  argocd.argoproj.io/sync-options: ServerSideApply=true

resources:
- namespace.yaml
- https://github.com/dotdc/grafana-dashboards-kubernetes

helmCharts:
- name: kube-prometheus-stack
  namespace: monitoring
  releaseName: prometheus
  repo: https://prometheus-community.github.io/helm-charts
  version: 90.0.0
  includeCRDs: true
  valuesFile: kube-prometheus-stack.yaml
- name: node-exporter-textfiles
  releaseName: node-exporter-textfiles  
  repo: https://galexrt.github.io/container-node_exporter-textfiles
  version: 0.2.0
  valuesFile: node-exporter-textfiles.yaml


patches:
- target:
    group: apps
    kind: DaemonSet
    name: node-exporter-textfiles
    version: v1
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: monitoring
- target:
    group:
    kind: ServiceAccount
    name: node-exporter-textfiles
    version: v1
  patch: |-
    - op: replace
      path: /metadata/namespace
      value: monitoring
