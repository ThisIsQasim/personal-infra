---
prometheus:
  prometheusSpec:
    externalUrl: "https://prometheus.home.com"
    externalLabels:
      cluster: home
    remoteWrite:
    - url: "https://vm-demo.work.com/prometheus/api/v1/write"
      basicAuth:
          username:
            name: kubepromsecret
            key: vmuser
          password:
            name: kubepromsecret
            key: vmpass
      queueConfig: #2x the default
        capacity: 5000
        maxSamplesPerSend: 1000
        maxShards: 400
    # - url: "https://prometheus.work.com/api/v1/write"
    #   basicAuth:
    #       username:
    #         name: kubepromsecret
    #         key: username
    #       password:
    #         name: kubepromsecret
    #         key: password
    retention: 1d
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
              - node2
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/
grafana:
  imageRenderer:
    enabled: true
  grafana.ini:
    log:
      level: debug
    unified_alerting.screenshots:
      capture: true
      upload_external_image_storage: false
alertmanager:
  podDisruptionBudget:
    enabled: false
  alertManagerSpec:
    externalUrl: "https://alertmanager.home.com"
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
    receivers:
    - name: 'null'
  route:
    main:
      enabled: true
      hostnames:
      - alertmanager.home.com
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway
        namespace: istio-ingress
        sectionName: https
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: X-Forwarded-Host
            value: alertmanager.home.com

