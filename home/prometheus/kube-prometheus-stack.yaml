---
prometheus:
  prometheusSpec:
    externalUrl: "https://prometheus.home.com"
    externalLabels:
      cluster: home
    remoteWrite:
    - url: "https://cortex.work.com/api/v1/push"
      # No secret: cortex's ingest sidecar trusts this cluster's own
      # ServiceAccount tokens (JWT source "f8k"), so this just points at
      # the token every pod already gets by default. `authorization`
      # (the non-deprecated field) can only reference a Secret, not a
      # file, so bearerTokenFile is the one that actually fits here.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      queueConfig: #2x the default
        capacity: 5000
        maxSamplesPerSend: 1000
        maxShards: 400
    retention: 1d
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: kubernetes.io/hostname
              operator: NotIn
              values:
              - node2
prometheus-node-exporter:
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$
    - --collector.textfile.directory=/host/root/var/lib/node_exporter/
grafana:
  imageRenderer:
    enabled: true
  grafana.ini:
    log:
      level: debug
    unified_alerting.screenshots:
      capture: true
      upload_external_image_storage: false
alertmanager:
  podDisruptionBudget:
    enabled: false
  alertManagerSpec:
    externalUrl: "https://alertmanager.home.com"
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: 'null'
      routes:
      - match:
          alertname: Watchdog
        receiver: 'null'
      - match:
          alertname: InfoInhibitor
        receiver: 'null'
    receivers:
    - name: 'null'
  route:
    main:
      enabled: true
      hostnames:
      - alertmanager.home.com
      parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: gateway
        namespace: istio-ingress
        sectionName: https
      filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
          - name: X-Forwarded-Host
            value: alertmanager.home.com

