# Values for the istio/gateway chart (kustomization.yaml).
# Name keeps the Service at gateway-istio.istio-ingress, which CoreDNS rewrites to (inventory.yaml).
name: gateway-istio
kind: DaemonSet
autoscaling:
  enabled: false
service:
  type: LoadBalancer
  externalTrafficPolicy: Local
  annotations:
    kube-vip.io/loadbalancerIPs: y.y.y.y
# Lets Gateway-targeted policies (auth-policies.yaml) resolve to these pods.
labels:
  gateway.networking.k8s.io/gateway-name: gateway
