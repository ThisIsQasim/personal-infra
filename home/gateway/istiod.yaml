meshConfig:
  extensionProviders:
  - name: "authentik"
    envoyExtAuthzHttp:
      service: "ak-outpost-authentik-embedded-outpost.authentik.svc.cluster.local"
      port: "9000"
      pathPrefix: "/outpost.goauthentik.io/auth/envoy"
      headersToDownstreamOnAllow:
      - cookie
      headersToUpstreamOnAllow:
      - set-cookie
      - x-authentik-email
      - x-authentik-groups
      - x-authentik-name
      - x-authentik-username
      - x-authentik-uid
      # Add the 'authorization' header to headersToUpstreamOnAllow if you need proxy providers which
      # send a custom HTTP-Basic Authentication header based on values from authentik
      # - authorization
      includeRequestHeadersInCheck:
      - cookie
