---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: istio-gateway-wildcard-cert
  namespace: cert-manager
spec:
  from:
  - group: gateway.networking.k8s.io
    kind: Gateway
    namespace: istio-ingress
  to:
  - group: ""
    kind: Secret
    name: cluster-wildcard-cert
  - group: ""
    kind: Secret
    name: code-server-cert
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: code-server
  namespace: cert-manager
spec:
  dnsNames:
  - "*.code.home.com"
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: letsencrypt
  secretName: code-server-cert
  usages:
  - digital signature
  - key encipherment
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway
  namespace: istio-ingress
spec:
  gatewayClassName: istio
  # A Hostname address marks the Gateway as manually deployed: Istio does not
  # create a Deployment or Service, it configures the proxies behind this Service.
  addresses:
  - type: Hostname
    value: gateway-istio.istio-ingress.svc.cluster.local
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        name: cluster-wildcard-cert
        namespace: cert-manager
    allowedRoutes:
      namespaces:
        from: All
  - name: https-code-server
    protocol: HTTPS
    port: 443
    hostname: "*.code.home.com"
    tls:
      mode: Terminate
      certificateRefs:
      - group: ''
        kind: Secret
        name: code-server-cert
        namespace: cert-manager
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: istio-ingress
spec:
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: gateway
    namespace: istio-ingress
    sectionName: http
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 308
    matches:
      - path:
          type: PathPrefix
          value: /
